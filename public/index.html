<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>在线课程顾问</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ededed;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #07c160;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-size: 17px;
      font-weight: 500;
      position: relative;
      flex-shrink: 0;
    }

    .header .status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
    }

    .message.bot .avatar {
      background: #07c160;
      margin-right: 10px;
    }

    .message.user .avatar {
      background: #576b95;
      margin-left: 10px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .message.bot .bubble {
      background: #fff;
      color: #333;
    }

    .message.bot .bubble::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 12px;
      border: 6px solid transparent;
      border-right-color: #fff;
      border-left: 0;
    }

    .message.user .bubble {
      background: #95ec69;
      color: #333;
    }

    .message.user .bubble::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 12px;
      border: 6px solid transparent;
      border-left-color: #95ec69;
      border-right: 0;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: none;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .typing-indicator.show {
      display: flex;
    }

    .typing-indicator .bubble {
      background: #fff;
      padding: 14px 18px;
    }

    .typing-indicator .bubble::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 12px;
      border: 6px solid transparent;
      border-right-color: #fff;
      border-left: 0;
    }

    .dot-flashing {
      display: flex;
      gap: 4px;
    }

    .dot-flashing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
      animation: dotPulse 1.4s infinite ease-in-out;
    }

    .dot-flashing span:nth-child(2) { animation-delay: 0.2s; }
    .dot-flashing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Quick Replies */
    .quick-replies {
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #ededed;
      flex-shrink: 0;
    }

    .quick-reply-btn {
      padding: 6px 14px;
      border: 1px solid #07c160;
      border-radius: 16px;
      background: #fff;
      color: #07c160;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-reply-btn:active {
      background: #07c160;
      color: #fff;
    }

    /* Input Area */
    .input-area {
      background: #f7f7f7;
      padding: 10px 12px;
      display: flex;
      align-items: flex-end;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }

    .input-area textarea {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 100px;
      min-height: 36px;
      line-height: 1.4;
      font-family: inherit;
      background: #fff;
    }

    .input-area textarea:focus {
      border-color: #07c160;
    }

    .send-btn {
      margin-left: 10px;
      padding: 8px 16px;
      background: #07c160;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
      height: 36px;
    }

    .send-btn:disabled {
      background: #9ed7b8;
      cursor: not-allowed;
    }

    .send-btn:active:not(:disabled) {
      background: #06ad56;
    }

    /* System message */
    .system-msg {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 8px 0 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>在线课程顾问</div>
    <div class="status">在线</div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="system-msg">课程顾问已接入，有什么可以帮您？</div>
  </div>

  <div class="typing-indicator" id="typingIndicator">
    <div class="avatar" style="background:#07c160; margin-right:10px;">🎓</div>
    <div class="bubble">
      <div class="dot-flashing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <div class="quick-replies" id="quickReplies">
    <button class="quick-reply-btn" onclick="sendQuickReply(this)">想了解课程</button>
    <button class="quick-reply-btn" onclick="sendQuickReply(this)">课程价格</button>
    <button class="quick-reply-btn" onclick="sendQuickReply(this)">免费体验</button>
    <button class="quick-reply-btn" onclick="sendQuickReply(this)">如何报名</button>
  </div>

  <div class="input-area">
    <textarea id="messageInput" rows="1" placeholder="输入消息..."
      onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
  </div>

  <script>
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const quickReplies = document.getElementById('quickReplies');

    let conversationHistory = [];
    let isWaiting = false;

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function scrollToBottom() {
      setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 50);
    }

    function addMessage(content, role) {
      const div = document.createElement('div');
      div.className = `message ${role === 'user' ? 'user' : 'bot'}`;

      const avatar = role === 'user' ? '👤' : '🎓';
      div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble">${escapeHtml(content)}</div>
      `;

      chatArea.appendChild(div);
      scrollToBottom();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, '<br>');
    }

    function showTyping() {
      typingIndicator.classList.add('show');
      scrollToBottom();
    }

    function hideTyping() {
      typingIndicator.classList.remove('show');
    }

    function sendQuickReply(btn) {
      messageInput.value = btn.textContent;
      sendMessage();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isWaiting) return;

      addMessage(text, 'user');
      messageInput.value = '';
      messageInput.style.height = 'auto';
      isWaiting = true;
      sendBtn.disabled = true;

      // Hide quick replies after first message
      quickReplies.style.display = 'none';

      conversationHistory.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.reply || '抱歉，暂时无法回复，请稍后再试。';

        hideTyping();
        addMessage(reply, 'bot');
        conversationHistory.push({ role: 'assistant', content: reply });
      } catch (err) {
        hideTyping();
        addMessage('网络异常，请检查连接后重试。', 'bot');
        console.error('Chat error:', err);
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }
  </script>
</body>
</html>
